
; PlatformIO Project Configuration File
; This pins the exact platform, board, and framework versions
; so everyone on the team builds against the identical toolchain.
 
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
 
; Pinning the platform version explicitly (instead of leaving it floating)
; avoids "it built fine last week" surprises when Espressif ships an update.
; Once this is working, check the current stable version and pin it here, e.g.:
; platform = espressif32@6.9.0